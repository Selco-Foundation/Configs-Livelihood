# AMC persister for Livelihood. GENERATED by development/AMC_module (persister/gen.py), LLD 07 §7.2, 2026-11-16.
# Union of E4H develop + the Livelihood columns (activity_facility_id; visit vendor_id, submission dates,
# approved_by). Rules:
#  - update-* topics write every listed column: the service always sends the full stored object.
#  - activity_facility_id is insert-only; reminder_sent_at and non_functional_notified_at are never written
#    here (targeted JDBC claims in the service only).
#  - is_active on both assignment tables is written on insert AND upsert (field-staff change switches the
#    old row off and the new one on in one message; a returning person's old row is reactivated by id).
#  - Visit, visit-assignment and asset_amc inserts are ON CONFLICT (id) DO NOTHING: ids are fixed
#    (name-based UUIDs), so a repeated create is harmless instead of failing the whole message.
#  - save-active-amc-configuration / activate-amc-configuration carry AmcConfigurations + ScheduledVisit +
#    AssetAmcs in ONE message, written in one DB transaction (review A7). Audit is off for these two
#    (the audit base path $.* assumes a single entity list).
#  - save-amc-plan / update-amc-plan (E4H Excel plans) are not used by Livelihood and not included.
serviceMaps:
  serviceName: AMC
  mappings:
    - version: 1.0
      name: AMC Configuration
      description: "Creates AMC configurations and their assignment rows"
      fromTopic: save-amc-configuration
      isTransaction: true
      isAuditEnabled: true
      module: AMC
      objecIdJsonPath: $.id
      tenantIdJsonPath: $.tenantId
      userUuidJsonPath: $.[0].auditDetails.createdBy
      transactionCodeJsonPath: $.id
      auditAttributeBasePath: $.*
      queryMaps:
        - query: INSERT INTO amc_configuration (id, tenant_id, vendor_id, facility_id, asset_types, project_id, duration_months, visit_frequency_months, configuration_start_date, configuration_end_date, status, geography_details, additional_details, amc_plan_id, activity_facility_id, created_by, created_time, last_modified_by, last_modified_time) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?);
          basePath: $.AmcConfigurations.*
          jsonMaps:
            - jsonPath: $.AmcConfigurations.*.id
            - jsonPath: $.AmcConfigurations.*.tenantId
            - jsonPath: $.AmcConfigurations.*.vendorId
            - jsonPath: $.AmcConfigurations.*.facilityId
            - jsonPath: $.AmcConfigurations.*.assetTypes
              type: JSON
              dbType: JSONB
            - jsonPath: $.AmcConfigurations.*.projectId
            - jsonPath: $.AmcConfigurations.*.durationMonths
            - jsonPath: $.AmcConfigurations.*.visitFrequencyMonths
            - jsonPath: $.AmcConfigurations.*.configurationStartDate
            - jsonPath: $.AmcConfigurations.*.configurationEndDate
            - jsonPath: $.AmcConfigurations.*.status
            - jsonPath: $.AmcConfigurations.*.geographyDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.AmcConfigurations.*.additionalDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.AmcConfigurations.*.amcPlanId
            - jsonPath: $.AmcConfigurations.*.activityFacilityId
            - jsonPath: $.AmcConfigurations.*.auditDetails.createdBy
            - jsonPath: $.AmcConfigurations.*.auditDetails.createdTime
            - jsonPath: $.AmcConfigurations.*.auditDetails.lastModifiedBy
            - jsonPath: $.AmcConfigurations.*.auditDetails.lastModifiedTime
        - query: INSERT INTO amc_configuration_assignments (id, tenant_id, amc_configuration_id, assigned_user, is_active, role, additional_details, poc_number, created_by, created_time, last_modified_by, last_modified_time) VALUES (?, ?, ?, ?, COALESCE(?, true), ?, ?, ?, ?, ?, ?, ?);
          basePath: $.AmcConfigurations.*.assignments.*
          jsonMaps:
            - jsonPath: $.AmcConfigurations.*.assignments.*.id
            - jsonPath: $.AmcConfigurations.*.assignments.*.tenantId
            - jsonPath: $.AmcConfigurations[*][?({id} in @.assignments[*].id)].id
            - jsonPath: $.AmcConfigurations.*.assignments.*.assignedUser
            - jsonPath: $.AmcConfigurations.*.assignments.*.isActive
